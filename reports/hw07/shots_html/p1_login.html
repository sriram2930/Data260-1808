<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>curl -- /auth/login (valid + invalid)</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0d1117;
    font-family: "Cascadia Code", "Consolas", monospace;
  }
  .window {
    width: 980px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 6px 24px rgba(0,0,0,0.5);
    border: 1px solid #30363d;
  }
  .titlebar {
    background: #21262d;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .dot.red { background: #ff5f56; }
  .dot.yellow { background: #ffbd2e; }
  .dot.green { background: #27c93f; }
  .titletext {
    color: #8b949e;
    font-size: 13px;
    margin-left: 10px;
  }
  .body {
    background: #0d1117;
    color: #c9d1d9;
    padding: 18px 20px;
    font-size: 13.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .prompt { color: #58a6ff; }
  .ok { color: #3fb950; }
  .err { color: #f85149; }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
      <span class="titletext">curl -- /auth/login (valid + invalid)</span>
    </div>
    <div class="body">--- login valid (advisor/moderator) ---
{&quot;access_token&quot;:&quot;REDACTED-JWT-example-only-not-a-live-credential&quot;,&quot;token_type&quot;:&quot;bearer&quot;,&quot;role&quot;:&quot;moderator&quot;}
HTTP 200

--- login invalid password ---
{&quot;detail&quot;:&quot;Invalid username or password&quot;}
HTTP 401</div>
  </div>
</body>
</html>
