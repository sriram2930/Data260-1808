# Custom nginx config — serve the app on PORT_BASE (8008) end-to-end
# (container listens on 8008; docker run and ECS container port mappings match)
server {
    listen 8008;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
