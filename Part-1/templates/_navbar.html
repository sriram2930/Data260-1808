{# Shared Bootstrap navbar. Expects `user` in the template context (a display
   name string if logged in, otherwise None/undefined). #}
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">Campus Course Catalogue</a>
    <div class="d-flex align-items-center gap-2">
      {% if user %}
      <span class="navbar-text text-white-50 small me-2">Signed in as {{ user }}</span>
      <a class="btn btn-outline-light btn-sm" href="/dashboard">Dashboard</a>
      <a class="btn btn-outline-light btn-sm" href="/logout">Log out</a>
      {% else %}
      <a class="btn btn-outline-light btn-sm" href="/login">Log in</a>
      {% endif %}
    </div>
  </div>
</nav>
