<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - HW3-Sreeram Achutuni</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  {% include "_navbar.html" %}
  <main class="container" style="max-width: 480px;">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 card-title mb-3">Log in</h1>
        <p class="text-muted small">Campus Course Catalogue &amp; Enrolment admin area.</p>

        {% if error %}
        <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username"
                   placeholder="advisor" required autofocus>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="course123" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Log in</button>
        </form>

        <p class="text-muted small mt-3 mb-0">
          Demo credentials: <code>advisor</code> / <code>course123</code>.
          Session idle-times-out after 30 seconds of no requests, just for
          this homework so the timeout is actually demoable.
        </p>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
