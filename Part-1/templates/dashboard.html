<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - HW3-Sreeram Achutuni</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  {% include "_navbar.html" %}
  <main class="container" style="max-width: 640px;">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 card-title">Welcome, {{ user }}</h1>
        <p class="text-muted">
          You're logged in to the Campus Course Catalogue &amp; Enrolment
          admin area. From here you can manage the course listings.
        </p>
        <a href="/" class="btn btn-primary me-2">Manage courses</a>
        <a href="/logout" class="btn btn-outline-secondary">Log out</a>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
